<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selcore</title>
    <link rel="icon" href="./images/favicon.png" />
    <link rel="stylesheet" href="checkout.css" />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="index.html"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="2em"
          height="2em"
          viewBox="0 0 15 15"
        >
          <path d="M0 0h15v15H0z" fill="none" />
          <path
            fill="#ffffff"
            d="M12 15h-2v-2H9v2H6v-2H5v2H3v-4H0V2h2V0h11v2h2v9h-3zM9 8H6v2h3zM6 3H4v2H2v2h4zm5 0H9v4h4V5h-2z"
          />
        </svg>
        <span>SELCORE</span>
      </a>
      <nav class="burgerMenu">
        <a href="allproducts.html?category=new">New Arrivals</a>
        <a href="allproducts.html?category=mobile">Cell Phones</a>
        <a href="allproducts.html?category=computer">Computers & Tablets</a>
        <a href="allproducts.html?category=accessory">Accessories</a>
        <a href="allproducts.html?category=sale">Sale</a>
        <a href="contact.html">contact</a>
      </nav>
      <!-- From Uiverse.io by vk-uiux -->
      <!-- From Uiverse.io by JaydipPrajapati1910 -->
      <label for="burger" class="burger">
        <input id="burger" type="checkbox" />
        <span></span>
        <span></span>
        <span></span>
      </label>
    </header>
    <main>
      <section class="checkoutSection">
        <div class="title-prodicts">
          <h1>checkout</h1>
          <div class="checkoutProducts"></div>
        </div>
        <div class="form-buy">
          <form
            class="addressForm"
            method="post"
            data-unavailable="Address confirmation is not connected yet. Your address has not been saved and no order has been placed."
          >
            <input type="text" placeholder="Full Name" required />

            <input type="text" placeholder="Address" required />

            <div class="addressRow">
              <input type="text" placeholder="City" required />
              <input type="text" placeholder="ZIP Code" required />
            </div>

            <input type="tel" placeholder="Phone Number" required />

            <button type="submit">Confirm Address</button>
          </form>

          <div class="totalPrice-button">
            <div class="sumPrice"></div>

            <button class="buyBtn">Buy</button>
          </div>
        </div>
      </section>
    </main>
    <script src="vendor/supabase-2.110.7.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-service.js"></script>
    <script src="catalogue-service.js"></script>
    <script src="store.js"></script>
    <script src="auth-ui.js"></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>
    <script src="favorites.js"></script>
  </body>
</html>
