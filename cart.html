    <main>
      <section class="cartHero">
        <div class="cartHeroContent">
          <h3>cart</h3>
          <div class="cartContainer"></div>
          <div class="cartTotal"><span>total Price</span></div>
        </div>
        <div class="buyContainer"></div>
      </section>
    </main>
    <script src="script.js"></script>
    <script src="products.js"></script>
    <script>
      const cartContainer = document.querySelector(".cartContainer");
      const cartTotal = document.querySelector(".cartTotal");
      const buyContainer = document.querySelector(".buyContainer");

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        cartContainer.innerHTML = "";

        // if cart is empty
        if (cart.length === 0) {
          cartContainer.innerHTML = `
        <div class="emptyCart">
          <h2>Your cart is empty</h2>
        </div>
      `;

          cartTotal.innerHTML = `
        <span>Total Price: 0₾</span>
      `;

          // add shop now button
          buyContainer.innerHTML = `
        <button class="shopNow" onclick="goToProducts()">
          Shop Now
        </button>
      `;

          return;
        }

        // if products are in cart
        buyContainer.innerHTML = `
          <a href="checkout.html" class="checkoutBtn">Checkout</a>  
            `;

        let totalPrice = 0;

        cart.forEach((product, index) => {
          const price = product.sale ? product.salePrice : product.price;
          const quantity = product.quantity || 1;

          //price by quantity
          totalPrice += price * quantity;

          cartContainer.innerHTML += `
        <div class="cartCard">

          <div class="cartCardImage">
            <img src="${product.image}" alt="${product.name}">
          </div>

          <div class="cartCardContent">
            <h2>${product.name}</h2>

            <p class="cartPrice">
              ${price}₾
            </p>

            <div class="cartQuantity">
              <button onclick="decreaseQuantity(${index})">−</button>

              <span>${quantity}</span>

              <button onclick="increaseQuantity(${index})">+</button>
            </div>

            <button
              class="removeCart"
              onclick="removeFromCart(${index})"
            >
              Remove
            </button>
          </div>

        </div>
      `;
        });

        cartTotal.innerHTML = `
      <span>Total Price: ${totalPrice}₾</span>
    `;
      }

      // Shop Now → allproducts.html
      function goToProducts() {
        window.location.href = "allproducts.html";
      }

      //quantity++

      function increaseQuantity(index) {
        if (!cart[index].quantity) {
          cart[index].quantity = 1;
        }

        cart[index].quantity++;

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      //quantity--
      function decreaseQuantity(index) {
        if (!cart[index].quantity) {
          cart[index].quantity = 1;
        }

        if (cart[index].quantity > 1) {
          cart[index].quantity--;
        } else {
          cart.splice(index, 1);
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      // product remove
      function removeFromCart(index) {
        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      renderCart();
    </script>
    <script src="favorites.js"></script>
  </body>
